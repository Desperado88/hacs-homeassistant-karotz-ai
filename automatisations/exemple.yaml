alias: "Karotz RFID - Prompt Claude LLM"
trigger:
  - platform: event
    event_type: karotz_ai_rfid_scanned
action:
  # 1. Animation LED pendant que Claude traite la demande
  - service: light.turn_on
    target:
      entity_id: light.karotz_ai_led
    data:
      rgb_color: [255, 85, 0]

  # 2. Envoi à l'agent vocal Claude
  - service: conversation.process
    data:
      agent_id: conversation.claude
      text: "Badge scanné : {{ trigger.event.data.tag_id }}. Résume ma journée et donne-moi un conseil du jour."
    response_variable: claude_response

  # 3. Réponse vocale du Karotz
  - service: media_player.play_media
    target:
      entity_id: media_player.karotz_ai_speaker
    data:
      media_type: "text"
      media_id: "{{ claude_response.response.speech.plain.speech }}"